<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
</head>
<body>
	<form action="register!saveMessage" method="post" name="personalMessageForm" enctype="multipart/form-data">
		姓名：<input type="text" name="name"/> 
		<br/>
		爱好：<input type="checkbox" name="hobby" value="1"/>篮球  &nbsp;&nbsp;<input type="checkbox" name="hobby" value="2"/>足球&nbsp;&nbsp;
		<input type="checkbox" name="hobby" value="3"/> 排球 
		<br/>
		性别：
		<select name="sex">
			<option value="1">男</option>
			<option value="2">女</option>
		</select>
		<br/>自评：
		<textarea name="description"></textarea>
		<br/>简历：
		<input type="file" name="resume" multiple='multiple'/>
		<br/>
		<input type="submit" value="提交"/> &nbsp;&nbsp;<input type="reset" value="重置"/>
	</form>

</body>
</html>
