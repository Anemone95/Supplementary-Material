<html>
	<head>
		<meta charset="utf-8">
	     <meta http-equiv="X-UA-Compatible" content="IE=edge">
	     <meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.2/css/bootstrap.min.css">
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.2/css/bootstrap-theme.min.css">
		<link rel="stylesheet" href="app.css">
	</head>
	<body>
		Use Current Location: <input class="js_use_location" type="checkbox" ><br>
		City: <input class="js_city_input typeahead" type="text" data-provide="typeahead" autocomplete="off">
		<br>
		<div class="js_suggestions" ></div>
		<br>
		<button class="btn btn-primary js_submit">Submit</button>
		<br>
		<textarea rows="1" cols="50" class="js_selected" ></textarea>
		<div class="js_weather" >
			Current Weather
			<ul class="js_weather_list" ></ul>
		</div>
	</body>

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.2/js/bootstrap.min.js"></script>
	<script src="lib/typeahead.js"></script>
	<script src="app.js" ></script>
</html>
